name: Update tidal currents

# Bakes docs/tide-uv.png + docs/tide-uv.json from FES2014 tidal current
# constituents, hourly. Completely separate from "Update tides" - it shares
# no script and no step with it, so it cannot break the tide bot.

on:
  # Enabled now that runs 36796317342 (cold, 18m12s) and 36798173041 (warm,
  # 49s) both succeeded end to end. With the cropped constituents cached a run
  # is under a minute, so hourly is cheap.
  #
  # :05 rather than :00 - the bake stamps the field at the top of the current
  # hour, and most cron schedules land on the hour, so starting a few minutes
  # later avoids the queue without making the field any older.
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Only against itself. A cold run downloads 4.2 GB and takes well over half
  # an hour, and it must not sit in front of the hourly tide bot - that uses
  # its own group (update-tides) and is deliberately left alone here.
  group: tide-currents
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    # Cold run measured: 263-555 s per archive download, x2, plus extraction and
    # cropping of 68 files. The fetch now retries a corrupt archive up to 3
    # times per component, so the worst case is several times that.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Dependencies FIRST: the fetch script crops each constituent to the
      # Australian box as it lands, which needs xarray and netCDF4. Installing
      # after the download would fail the fetch on a cold cache.
      - name: Install dependencies
        run: pip install --quiet pyTMD numpy pillow netCDF4 xarray scipy timescale

      # The constituents never change, so they are cached rather than committed.
      # Cropped to the AU box they are a few hundred MB; uncropped they would be
      # 9.0 GB against GitHub's 10 GB per-repo ceiling.
      - name: Restore FES2014 constituents
        id: fes-cache
        uses: actions/cache@v4
        with:
          path: fes-data
          key: fes2014-currents-au-crop-all34-v3

      - name: Download FES2014 constituents
        if: steps.fes-cache.outputs.cache-hit != 'true'
        env:
          AVISO_USER: ${{ secrets.AVISO_USER }}
          AVISO_PASS: ${{ secrets.AVISO_PASS }}
        run: |
          if [ -z "$AVISO_USER" ] || [ -z "$AVISO_PASS" ]; then
            echo "::error::AVISO_USER / AVISO_PASS are not set in this repo's secrets."
            echo "Add them at Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2 curl
          set -o pipefail
          bash scripts/fetch_fes.sh 2>&1 | tee /tmp/fes.log
          echo "fetch exit: ${PIPESTATUS[0]}"

      - name: Bake the field
        env:
          FES_DIR: fes-data
        run: python scripts/bake_tide_currents.py

      - name: Report what happened
        if: always()
        run: |
          mkdir -p docs
          {
            echo "run      ${{ github.run_id }}"
            echo "attempt  ${{ github.run_attempt }}"
            echo "when     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "outcome  ${{ job.status }}"
            echo
            echo "--- last 200 lines of the fetch ---"
            tail -200 /tmp/fes.log 2>/dev/null || echo "(no fetch log - the step never ran)"
          } > docs/_fes_fetch.log
          git config user.name  "tide-current-bot"
          git config user.email "tide-current-bot@users.noreply.github.com"
          git add docs/_fes_fetch.log
          git diff --cached --quiet && exit 0
          git commit -m "FES fetch log (${{ job.status }})"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done

      - name: Commit and push
        if: success()
        run: |
          git config user.name  "tide-current-bot"
          git config user.email "tide-current-bot@users.noreply.github.com"
          git add docs/tide-uv.png docs/tide-uv.json
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Update tidal currents"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push failed, retrying ($i)"; sleep 5
          done
          exit 1
